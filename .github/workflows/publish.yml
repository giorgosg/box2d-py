name: Publish to PyPI

# A published release builds and uploads. Running it by hand builds and tests
# every wheel and the sdist but uploads nothing: a dry run of a release.
# (It used to also run on 'released' and on tag pushes, so one release
# started up to three uploads, which --skip-existing papered over.)
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-source:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build sdist
      run: python -m build --sdist

    - name: Upload sdist
      uses: actions/upload-artifact@v7
      with:
        name: sdist
        path: dist/*.tar.gz

  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest  # x86_64, glibc and musl
            archs: auto
          - os: ubuntu-24.04-arm  # aarch64, glibc and musl
            archs: auto
          - os: windows-latest
            archs: AMD64
          # Apple silicon natively, and Intel cross-compiled on the same runner.
          - os: macos-latest
            archs: arm64 x86_64

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    # Pinned, so a new cibuildwheel cannot change a release's wheels unseen.
    - name: Install cibuildwheel
      run: python -m pip install cibuildwheel==4.3.5

    # No cmake step here: the Linux wheels are built inside the manylinux
    # container, which has its own cmake, so installing one on the runner
    # would not reach the build.
    - name: Build wheels
      run: python -m cibuildwheel --output-dir wheelhouse
      env:
        # The extension is built against the stable ABI, so one cp312-abi3
        # wheel per platform serves CPython 3.12 and every later version.
        CIBW_BUILD: cp312-*
        CIBW_ARCHS: ${{ matrix.archs }}
        # Each wheel is tested once built. The suite reads a few files from
        # the repository, so it runs from the checkout, but imports the
        # installed wheel: nothing puts src/ on the path.
        CIBW_TEST_REQUIRES: pytest
        CIBW_TEST_COMMAND: >-
          cd {project} && python -m pytest src/tests -q -p no:cacheprovider
          --ignore=src/tests/test_build_config.py
        # cmd's cd does not change drive without /d, and cibuildwheel tests
        # from a temporary directory on C: while the checkout is on D:.
        CIBW_TEST_COMMAND_WINDOWS: >-
          cd /d {project} && python -m pytest src/tests -q -p no:cacheprovider
          --ignore=src/tests/test_build_config.py

    - name: Upload wheels
      uses: actions/upload-artifact@v7
      with:
        name: wheels-${{ matrix.os }}
        path: ./wheelhouse/*.whl

  publish:
    needs: [build-source, build-wheels]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    # PyPI's trusted publishing: GitHub vouches for this workflow with a
    # short-lived token, so no API token is stored. box2d-python on PyPI
    # trusts giorgosg/box2d-py's publish.yml, with no environment.
    permissions:
      id-token: write
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: '*'
        path: dist
        merge-multiple: true

    - name: List files to upload
      run: find dist -type f | sort

    # Both the wheels and the sdist, which download-artifact put in dist/.
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@v1.14.3
