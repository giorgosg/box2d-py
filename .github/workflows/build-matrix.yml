name: Build Matrix

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # The version is the one pinned in the dev extra, so CI, pre-commit and
      # a local `uv sync --extra dev` all run the same ruff.
      - name: Install ruff
        run: |
          pip install "$(python -c 'import tomllib; dev = tomllib.load(open("pyproject.toml", "rb"))["project"]["optional-dependencies"]["dev"]; print(next(d for d in dev if d.startswith("ruff")))')"

      - name: Lint
        run: ruff check src setup.py web docs/source

      - name: Check formatting
        run: ruff format --check src setup.py web docs/source

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # GitHub's Windows image has MinGW's gcc on PATH, which once let a build
      # that called gcc directly pass here and fail for anyone with only
      # Visual Studio. Take it off PATH so this job builds the way they would.
      - name: Hide gcc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $kept = ($env:PATH -split ';') | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'gcc.exe')) }
          "PATH=$($kept -join ';')" >> $env:GITHUB_ENV

      - name: Check gcc is gone (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command gcc -ErrorAction SilentlyContinue) { throw "gcc is still on PATH" }

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install cffi setuptools wheel

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      # The matrix exists to check the compiled binding on each platform. The
      # testbed is pure Python on top of imgui, so it is worth testing once
      # rather than on every job -- and its tests skip cleanly without this,
      # which is how the others run.
      - name: Install the testbed extra (one platform)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: pip install -e ".[dev,testbed]"

      - name: Run tests
        run: pytest
