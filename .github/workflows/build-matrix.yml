name: Build Matrix

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12', '3.13']

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install cffi setuptools wheel

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      # The matrix exists to check the compiled binding on each platform. The
      # testbed is pure Python on top of imgui, so it is worth testing once
      # rather than six times -- and its tests skip cleanly without this,
      # which is how the other five jobs run.
      - name: Install the testbed extra (one platform)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: pip install -e ".[dev,testbed]"

      - name: Run tests
        run: pytest
