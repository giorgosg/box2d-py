name: Build Matrix

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # The version is the one pinned in the dev extra, so CI, pre-commit and
      # a local `uv sync --extra dev` all run the same ruff.
      - name: Install ruff
        run: |
          pip install "$(python -c 'import tomllib; dev = tomllib.load(open("pyproject.toml", "rb"))["project"]["optional-dependencies"]["dev"]; print(next(d for d in dev if d.startswith("ruff")))')"

      - name: Lint
        run: ruff check src testbed setup.py web docs/source

      - name: Check formatting
        run: ruff format --check src testbed setup.py web docs/source

  # The API reference is autodoc reading the installed package, so the package
  # is built first. -W makes a warning fail the job and -n reports every
  # reference that resolves to nothing; readthedocs would publish either
  # silently. Installed the way readthedocs installs it: the package itself,
  # not editable, plus docs/requirements.txt. intersphinx fetches CPython's
  # inventory, so this needs the network, which the runner has.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install the package and Sphinx
        run: |
          python -m pip install --upgrade pip
          pip install . -r docs/requirements.txt

      - name: Build the docs
        run: sphinx-build -W --keep-going -n -b html docs/source docs/build/html

  # The package ships a py.typed marker, which promises type checkers and
  # editors a fully annotated public API. pyright's --verifytypes checks that
  # promise against the installed package, py.typed included, and exits
  # non-zero if any public symbol's type is missing or partly unknown -- so
  # the job fails the moment the completeness score drops below 100%.
  # --ignoreexternal leaves out types pyright cannot see into, which here are
  # cffi's: its cdata, and the debug-draw callbacks @ffi.callback wraps. The
  # pyright version is the one pinned in the dev extra.
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install the package and pyright
        run: |
          python -m pip install --upgrade pip
          pip install . "$(python -c 'import tomllib; dev = tomllib.load(open("pyproject.toml", "rb"))["project"]["optional-dependencies"]["dev"]; print(next(d for d in dev if d.startswith("pyright")))')"

      - name: Check the public API is fully typed
        run: pyright --verifytypes box2d --ignoreexternal

  # Both packages, each on its own: the binding's wheel must not carry the
  # testbed, and a stale build/ on a developer's machine would hide it if it
  # did, so the check runs on a clean one.
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Build both packages
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist .
          python -m build --wheel --outdir dist testbed

      - name: Check each wheel holds only its own package
        run: python src/tools/check_wheels.py dist

  # Pyodide's wheel, tested inside Pyodide under node. cibuildwheel's settings
  # are in pyproject.toml, shared with publish.yml.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Pyodide 0.29 is Python 3.13, and cibuildwheel builds with the same.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.3.5

      - name: Build and test the wheel
        run: python -m cibuildwheel --platform pyodide --output-dir wheelhouse
        env:
          CIBW_BUILD: cp313-*

      - name: Check it against the budget
        run: python src/tools/wasm_budget.py check wheelhouse wasm-import.json

      - name: Upload the wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-pyodide
          path: wheelhouse/*.whl

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # GitHub's Windows image has MinGW's gcc on PATH, which once let a build
      # that called gcc directly pass here and fail for anyone with only
      # Visual Studio. Take it off PATH so this job builds the way they would.
      - name: Hide gcc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $kept = ($env:PATH -split ';') | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'gcc.exe')) }
          "PATH=$($kept -join ';')" >> $env:GITHUB_ENV

      - name: Check gcc is gone (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command gcc -ErrorAction SilentlyContinue) { throw "gcc is still on PATH" }

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install cffi setuptools wheel

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      # The matrix exists to check the compiled binding on each platform. The
      # testbed is pure Python on top of imgui, so its windows are worth testing
      # once rather than on every job. The rest of its tests need no imgui, and
      # skip the ones that do, so every job has the testbed without its
      # dependencies. Not the `testbed` extra, which would take it from PyPI.
      - name: Install the testbed, without imgui
        run: pip install --no-deps -e ./testbed

      - name: Install imgui and the rest (one platform)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: pip install -e ./testbed

      - name: Run tests
        run: pytest
