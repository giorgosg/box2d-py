version: 2

# Box2D and enkiTS are compiled during the install below, so the submodules
# have to be there first. `submodules: include: all` is what fetches them;
# the pre_build hooks that used to repeat it ran too late to matter.
submodules:
  include: all

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  apt_packages:
    - cmake

python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .

sphinx:
  configuration: docs/source/conf.py

formats:
  - htmlzip
  - pdf

