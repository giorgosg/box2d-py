version: 2
submodules:
  include: all

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  apt_packages:
    - cmake
  jobs:
    pre_build:
      - git submodule init
      - git submodule update

python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .

sphinx:
  configuration: docs/source/conf.py

formats:
  - htmlzip
  - pdf

