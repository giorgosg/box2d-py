[build-system]
requires = ["setuptools>=75.8.0", "cffi>=1.16.0", "pcpp>=1.30", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "box2d-python"
version = "3.2.0rc1"
description = "Python bindings for the Box2D v3.2 physics engine"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Giorgos Giagas", email = "giorgosg@gmail.com" }
]
maintainers = [
  { name = "Giorgos Giagas", email = "giorgosg@gmail.com" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Games/Entertainment :: Simulation",
  "Topic :: Scientific/Engineering :: Physics",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]
dependencies = [
  "cffi>=1.16.0",
]

[project.optional-dependencies]
# A package of its own, released at this package's version, so that a game
# in the browser does not download it.
testbed = [
  "box2d-testbed==3.2.0rc1",
]
dev = [
    # Pinned, as are the pre-commit hook and CI's lint job (which reads this
    # line), so a formatter release cannot reformat files nobody touched.
    "ruff==0.16.10",
    # Pinned for the same reason: CI's types job reads this line, and a newer
    # pyright can count a symbol as incompletely typed that this one accepts.
    "pyright==1.1.414",
    "pcpp>=1.30",
    "setuptools>=75.8.0",
    "pre-commit",
    "pytest",
    "sphinx",
    "sphinx-rtd-theme",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["box2d", "box2d.*"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.rst", "*.so", "*.pyd", "*.dll", "py.typed"]

[tool.setuptools.exclude-package-data]
# The binding's C is compiled into the extension; the sdist carries it
# (MANIFEST.in), the wheel need not.
box2d = ["_bulk.c", "_bulk.h"]

# The WebAssembly wheel, built by `cibuildwheel --platform pyodide`. The version
# is the one web/index.html loads: a wheel only runs on Pyodide's matching ABI.
# The suite runs from the checkout, as for the other wheels, and leaves out
# the testbed's tests, as that is another package: build_wasm.sh runs them.
[tool.cibuildwheel.pyodide]
pyodide-version = "0.29.4"
test-requires = ["pytest"]
test-command = [
  "cd {project} && python -m pytest src/tests -q -p no:cacheprovider --ignore=src/tests/test_build_config.py",
  "python {project}/src/tools/wasm_budget.py import {project}/wasm-import.json",
]

# `uv sync --extra testbed` takes the testbed from this checkout, not PyPI.
[tool.uv.workspace]
members = ["testbed"]

[tool.uv.sources]
box2d-testbed = { workspace = true }

[tool.pytest.ini_options]
minversion = "6.0"
# The gui tests open a real window, so they are excluded by default and run
# with `pytest -m gui`. They are the only thing that exercises the OpenGL
# renderer and the imgui shell, so they matter on an imgui_bundle upgrade.
addopts = "-ra -q -m 'not gui'"
markers = [
  "gui: needs a display; opens a real testbed window",
]
testpaths = [
  "src/tests",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# Pyflakes (unused and undefined names), syntax errors, and bugbear's likely
# bugs. Formatting is ruff format's job, so no pycodestyle style rules.
select = ["F", "E9", "B"]
ignore = [
  # zip() without strict=: every zip here pairs sequences built together.
  "B905",
]

[tool.ruff.lint.per-file-ignores]
# Tests read attributes for the exception the read raises:
# `with pytest.raises(DestroyedError): body.position`.
"src/tests/**" = ["B018"]

[tool.ruff.lint.flake8-bugbear]
# Immutable, so safe as argument defaults.
extend-immutable-calls = [
  "box2d.math.Vec2",
  "box2d.math.Rot",
  "box2d.Vec2",
  "box2d.Rot",
  "box2d.debug_draw.Color",
  "box2d.Color",
]
