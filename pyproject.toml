[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "box2d-py"
version = "0.1.0"
description = "Bindings for box2d v3"
authors = ["Giorgos Giagas <giorgosg@gmail.com>"]
license = "MIT"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
packages = [
    { include = "box2d", from = "src" },
    { include = "testbed", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.12"
cffi = ">=1.16.0"
dearpygui = { version = "*", optional = true }

[tool.poetry.extras]
testbed = ["dearpygui"]

[tool.poetry.group.test.dependencies]
pytest = "*"

[tool.poetry.scripts]
box2d-testbed = "testbed.testbed:main"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "src/tests",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["box2d*", "testbed*"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.rst", "*.so", "*.pyd", "*.dll"]