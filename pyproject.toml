[build-system]
requires = ["setuptools>=75.8.0", "cffi>=1.16.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "box2d-python"
version = "0.1.3"
description = "Bindings for box2d v3"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Giorgos Giagas", email = "giorgosg@gmail.com" }
]
maintainers = [
  { name = "Giorgos Giagas", email = "giorgosg@gmail.com" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]
dependencies = [
  "cffi>=1.16.0",
]

[project.optional-dependencies]
testbed = [
  "imgui_bundle>=1.92",
  "PyOpenGL",
  "PyOpenGL-accelerate",
  "numpy"
]
dev = [
    "black",
    "setuptools>=75.8.0",
    "pre-commit",
    "pytest",
    "sphinx",
    "sphinx-rtd-theme",
]

[project.scripts]
box2d-testbed = "box2d_testbed:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["box2d*", "box2d_testbed*", "tools"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.rst", "*.so", "*.pyd", "*.dll", "*.vs", "*.fs"]

[tool.pytest.ini_options]
minversion = "6.0"
# The gui tests open a real window, so they are excluded by default and run
# with `pytest -m gui`. They are the only thing that exercises the OpenGL
# renderer and the imgui shell, so they matter on an imgui_bundle upgrade.
addopts = "-ra -q -m 'not gui'"
markers = [
  "gui: needs a display; opens a real testbed window",
]
testpaths = [
  "src/tests",
]
